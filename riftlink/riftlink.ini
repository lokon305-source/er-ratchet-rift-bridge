; Rift Apart -> Elden Ring link settings. Edit, then restart riftlink.exe.
[bridge]
; Must be the same folder Launch-Elden-Ring-Rift.cmd uses (leave empty = .\runtime)
;RuntimeDir=
; 1 = hide the stand-in Tarnished (only useful once Ratchet is drawn inside Elden Ring)
HideTarnished=1
RateHz=120

[mapping]
; Elden Ring metres per Rift Apart metre. Bigger = Ratchet looks bigger next to Elden Ring (and moves/jumps further)
Scale=1.25
HeightScale=1.0
; If the Tarnished moves the wrong way, try these one at a time:
FlipX=1
FlipZ=0
SwapXZ=0
; Rotates Ratchet's movement before it is applied in Elden Ring (degrees)
YawOffsetDeg=0
; Turns the Tarnished's facing (180 = it was facing backwards while moving)
FacingOffsetDeg=180

[camera]
; 1 = Elden Ring's camera follows Rift Apart's camera (Page Down toggles it while playing)
Follow=1
; 1 = use Rift Apart's real camera (eye + view direction), so the overlay lines up with Elden Ring
TrueCamera=1
; 1 = Elden Ring uses Rift Apart's field of view (FovDeg, or Ctrl+PgUp/PgDn, overrides it)
AutoFov=1
; Only used if the real camera isn't found: look this many metres above Ratchet's feet
TargetHeight=0
; Field of view in degrees; 0 keeps Elden Ring's own. Tune live with Ctrl+PgUp / Ctrl+PgDn until Ratchet's
; size matches the world, then put the number riftlink prints here.
FovDeg=0

[overlay]
; Cut-out mode: how close (0-765) to the background colour a pixel must be to be removed
KeyTolerance=60
; 1 = cut-out removes the dark background (Ratchet down in the dark); 0 = removes the top-left corner colour
KeyDark=1
; Pixels this dark (0-255) or darker are removed; from DarkFull up they're solid; in between they're see-through
; (glows, sparks, smoke). Raise DarkCut if a dark haze remains; lower DarkFull if dark parts of Ratchet look see-through
DarkCut=8
DarkFull=72
; 1 = measure how dark Rift Apart's background really is and cut just above it (no grey haze)
AutoCut=1

[terrain]
; 1 = feed Elden Ring's ground to Ratchet (needs riftbridge 0.2 faultrep.dll in Rift Apart)
Enabled=1
; Ground points around the Tarnished: GridSize x GridSize, Spacing metres apart
GridSize=25
Spacing=1.0
; Re-read the ground after the Tarnished moves this many metres
ResampleDist=2.5
; Delete (in either game): drop Ratchet this many metres under Rift Apart's level, into the dark (again = deeper),
; onto Elden Ring's ground (the Tarnished waits while he falls). 0 = off
SinkDepth=1000

[combat]
; Ratchet's shots and melee hurt Elden Ring enemies
Enabled=1
; Damage per shot / per melee swing (bridge units: a basic soldier takes ~10 shots at 3)
ShotDamage=1.5
ShotsPerSecond=5
MeleeDamage=6
; Shots hit the enemy nearest the centre of the view, within this range (m) and cone (degrees)
Range=60
AimConeDeg=6
MeleeRange=3
; Keys (Windows key codes): 1 = left mouse button, 70 = F. Pad: right trigger fires, X/Square melees.
FireKey=1
MeleeKey=70
; Shots land after travelling (metres per second); 0 = instantly
ProjectileSpeed=40
