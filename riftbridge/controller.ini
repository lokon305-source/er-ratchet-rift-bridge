; Controller -> Rift Apart while you play from the Elden Ring window.
; Rift Apart's own controller reading stops when its window isn't in front, so the
; controller is turned into keyboard keys and mouse moves. Set each button to the key
; Rift Apart uses for that action (Rift Apart: Settings > Controls > Keyboard).
; A button can also be "TAP|HOLD", e.g. Y=WHEELUP|MMB: a quick press scrolls, holding it holds the middle button.
; Keys: letters, digits, SPACE LSHIFT LCTRL LALT TAB ESC ENTER UP DOWN LEFT RIGHT F1-F12,
;       LMB RMB MMB WHEELUP WHEELDOWN, NONE. Left stick = W A S D, right stick = mouse look.
[controller]
Enabled=1
LookSpeed=1600
[buttons]
A=SPACE
B=C
X=F
Y=WHEELUP|MMB
LB=LSHIFT
RB=E
LT=RMB
RT=LMB
LS=LCTRL
RS=NONE
Start=ESC
Back=TAB
DPadUp=1
DPadRight=2
DPadDown=3
DPadLeft=4
